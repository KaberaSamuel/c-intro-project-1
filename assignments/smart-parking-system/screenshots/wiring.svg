<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <rect width="1120" height="620" fill="#f7f9fc"/>
  <text x="560" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17365d">Smart Parking Wiring Plan</text>
  <rect x="404" y="105" width="310" height="425" rx="24" fill="#dceeff" stroke="#34699a" stroke-width="4"/>
  <text x="559" y="151" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="#17365d">Arduino Uno</text>
  <g font-family="Arial, sans-serif" font-size="19" fill="#17365d">
    <text x="430" y="220">5V</text><text x="430" y="262">GND</text>
    <text x="430" y="328">D2</text><text x="430" y="370">D3</text>
    <text x="430" y="424">D8</text><text x="430" y="466">D9</text><text x="430" y="508">D10</text>
  </g>
  <g stroke="#425a70" stroke-width="3">
    <path d="M475 214 H390 V177 H344"/><path d="M475 256 H367 V225 H344"/>
    <path d="M475 322 H368 V287 H344"/><path d="M475 364 H368 V335 H344"/>
    <path d="M475 418 H764 V180 H800"/><path d="M475 460 H780 V310 H800"/><path d="M475 502 H780 V438 H800"/>
  </g>
  <rect x="70" y="138" width="274" height="225" rx="18" fill="#fff" stroke="#6b8297" stroke-width="3"/>
  <text x="207" y="177" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#17365d">HC-SR04</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#17365d">
    <text x="98" y="221">VCC → 5V</text><text x="98" y="263">GND → GND</text>
    <text x="98" y="305">TRIG → D2</text><text x="98" y="347">ECHO → D3</text>
  </g>
  <rect x="800" y="140" width="260" height="82" rx="14" fill="#e0f2df" stroke="#438a48" stroke-width="3"/>
  <text x="930" y="174" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#235d28">Green LED</text>
  <text x="930" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#235d28">D8 → 220 Ω → anode; cathode → GND</text>
  <rect x="800" y="270" width="260" height="82" rx="14" fill="#fde0e0" stroke="#bd4545" stroke-width="3"/>
  <text x="930" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#8b2020">Red LED</text>
  <text x="930" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#8b2020">D9 → 220 Ω → anode; cathode → GND</text>
  <rect x="800" y="400" width="260" height="82" rx="14" fill="#fff0cc" stroke="#c38b1b" stroke-width="3"/>
  <text x="930" y="434" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#704d0b">Buzzer</text>
  <text x="930" y="462" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#704d0b">Positive → D10; negative → GND</text>
  <text x="560" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#40546a">All component grounds connect to Arduino GND. Use one shared ground.</text>
</svg>
