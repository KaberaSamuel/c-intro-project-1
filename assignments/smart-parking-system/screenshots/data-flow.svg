<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420">
  <rect width="1120" height="420" fill="#f7f9fc"/>
  <text x="560" y="54" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#17365d">Smart Parking Data Flow</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="42" y="145" width="210" height="150" rx="16" fill="#dceeff" stroke="#34699a" stroke-width="3"/>
    <text x="147" y="198" font-size="23" font-weight="bold" fill="#17365d">HC-SR04</text>
    <text x="147" y="235" font-size="18" fill="#17365d">Measures echo time</text>
    <text x="147" y="266" font-size="18" fill="#17365d">and reports distance</text>

    <rect x="326" y="145" width="210" height="150" rx="16" fill="#e8e1f5" stroke="#7553a6" stroke-width="3"/>
    <text x="431" y="198" font-size="23" font-weight="bold" fill="#40236a">Arduino Uno</text>
    <text x="431" y="235" font-size="18" fill="#40236a">Reads the sensor</text>
    <text x="431" y="266" font-size="18" fill="#40236a">and calculates cm</text>

    <rect x="610" y="145" width="210" height="150" rx="16" fill="#fff0cc" stroke="#c38b1b" stroke-width="3"/>
    <text x="715" y="198" font-size="23" font-weight="bold" fill="#704d0b">Decision</text>
    <text x="715" y="235" font-size="18" fill="#704d0b">Distance ≤ 20 cm</text>
    <text x="715" y="266" font-size="18" fill="#704d0b">means occupied</text>

    <rect x="894" y="100" width="184" height="82" rx="14" fill="#e0f2df" stroke="#438a48" stroke-width="3"/>
    <text x="986" y="135" font-size="21" font-weight="bold" fill="#235d28">Green LED</text>
    <text x="986" y="161" font-size="16" fill="#235d28">Space available</text>
    <rect x="894" y="210" width="184" height="82" rx="14" fill="#fde0e0" stroke="#bd4545" stroke-width="3"/>
    <text x="986" y="245" font-size="21" font-weight="bold" fill="#8b2020">Red LED</text>
    <text x="986" y="271" font-size="16" fill="#8b2020">Occupied + buzzer</text>
  </g>
  <g fill="none" stroke="#455b70" stroke-width="4" marker-end="url(#arrow)">
    <path d="M252 220 H310"/><path d="M536 220 H594"/>
    <path d="M820 190 H854 V141 H882"/><path d="M820 246 H854 V251 H882"/>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#455b70"/></marker></defs>
  <text x="560" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#40546a">Sensor → Controller → Decision → LEDs and buzzer</text>
</svg>
